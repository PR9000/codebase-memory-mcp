name: FreeBSD CI

on:
  push:
    branches: [ main, freebsd-*, ci/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  freebsd-build-and-test:
    name: FreeBSD 15.1 (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build and tests inside FreeBSD 15.1 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          usesh: true
          mem: 8192
          cpu: 8
          prepare: |
            pkg update -f
            pkg install -y gmake sqlite3 pkgconf
          run: |
            echo "=== Building codebase-memory-mcp on FreeBSD 15.1 ==="
            gmake -f Makefile.cbm cbm
